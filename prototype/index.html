<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vertical Atlas — Prototype</title>
    <style>
      :root {
        --paper: #f7f0ea;
        --ink: #221c15;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        font-family: 'Inter', system-ui, sans-serif;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .header {
        position: absolute;
        top: 44px;
        right: 52px;
        color: var(--ink);
        pointer-events: none;
        text-align: right;
      }
      .kicker {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0.6;
        margin: 0 0 12px;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: 80px;
        line-height: 0.94;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        margin: 0;
      }
      .sub {
        font-size: 13px;
        opacity: 0.62;
        margin: 14px 0 0;
      }
      .attribution {
        position: absolute;
        left: 52px;
        bottom: 40px;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
        opacity: 0.45;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div class="header">
      <p class="kicker">Population landscape</p>
      <h1>Germany</h1>
      <p class="sub">Vertical Atlas · synthetic demo data</p>
    </div>
    <div class="attribution">
      Demo: synthetic data<br />Datenriff · Vertical Atlas
    </div>
    <script type="module" src="./viewer.mjs"></script>
  </body>
</html>
