[project]
name = "zensus-pipeline"
version = "0.1.0"
description = "Destatis Zensus 100m grid → H3 → binary sculpture buffers (Vertical Atlas Germany)"
requires-python = ">=3.10"
dependencies = [
    "h3>=4.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["zensus_pipeline*"]
